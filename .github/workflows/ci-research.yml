name: CI

# Every push and pull request, on every branch.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (npm run lint)
        run: npm run lint

      - name: Unit tests (offline, deterministic)
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Browser end-to-end tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Google Chrome is preinstalled on the ubuntu-latest runner image.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chrome version
        run: "$CHROME_PATH --version"

      # Builds, then serves the production bundle with PRECOMPUTE=0 TRACK_RECORD=0 OPEN_METEO_DAILY_BUDGET=0,
      # so the run makes no outbound weather calls.
      - name: End-to-end tests
        run: npm run test:e2e

  python-fastapi:
    name: Python FastAPI companion (syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile
        run: python3 -m py_compile services/fastapi_service/main.py

  flutter-mobile:
    # Disabled: apps/mobile targets the removed legacy API and its widget test fails (see apps/mobile/README.md).
    if: ${{ false }}
    name: Flutter mobile app (legacy API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Analyze and test
        working-directory: apps/mobile
        run: flutter pub get && flutter analyze && flutter test
