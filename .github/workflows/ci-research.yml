name: AlphaForge Atmosphere Cross-Platform CI (Web, Backend, Python, Mobile)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  web-and-backend:
    name: Web Platform & Node.js Gateway Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck & Lint
        run: npm run lint

      - name: Run Deterministic Weather, Market & Trade Idea Unit Tests
        run: npm test

      - name: Build Production Web Bundle
        run: npm run build

  python-fastapi-verification:
    name: Python FastAPI Scientific Verification Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax & Bytecode Compilation Check
        run: python3 -m py_compile services/fastapi_service/main.py

  flutter-mobile-analyze:
    name: Flutter Native Mobile (iOS & Android) Static Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter Widget & Model Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Android Debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
